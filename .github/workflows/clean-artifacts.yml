name: Clean old artifacts

# Render week uploads a shard artifact per video and a full-week artifact for
# delivery; both exist only to hand renders to the collect job and to the
# owner, never as the system of record (the collect job already pushes the
# real deliverable to a renders-week-NN branch). Actions artifact storage is
# a fixed account quota, and it has stayed exhausted for two days straight
# with nothing else able to free it, so this exists to reclaim it directly
# with the workflow's own GITHUB_TOKEN rather than needing manual deletion
# in the UI every time it fills up.

on:
  workflow_dispatch:
    inputs:
      older_than_hours:
        description: "Only delete artifacts older than this many hours (protects a render-week run still in flight); 0 deletes all"
        required: false
        default: "6"
  schedule:
    - cron: "23 4 * * 0"

permissions:
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    env:
      OLDER_THAN_HOURS: ${{ inputs.older_than_hours }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 0 is a real value (delete everything), so parse rather than ||.
            const parsed = Number(process.env.OLDER_THAN_HOURS);
            const cutoffHours = Number.isFinite(parsed) && parsed >= 0 ? parsed : 6;
            const cutoff = Date.now() - cutoffHours * 60 * 60 * 1000;
            // List everything first, then delete: deleting while paging
            // shifts later artifacts onto pages already read and skips them.
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let deleted = 0;
            let deletedBytes = 0;
            let kept = 0;
            for (const artifact of artifacts) {
              if (new Date(artifact.created_at).getTime() > cutoff) {
                kept++;
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              deleted++;
              deletedBytes += artifact.size_in_bytes;
              console.log(`deleted ${artifact.name} (${artifact.id}, ${(artifact.size_in_bytes / 1e6).toFixed(1)} MB, created ${artifact.created_at})`);
            }
            console.log(`Deleted ${deleted} artifact(s), ${(deletedBytes / 1e6).toFixed(1)} MB total. Kept ${kept} artifact(s) newer than ${cutoffHours}h.`);
