name: Deliver renders to branch

# Publishes a completed render run's artifact to a git branch
# (renders-week-NN), so environments that can only reach GitHub over
# git can fetch the finished videos.

on:
  push:
    branches: [main]
    paths: [".github/deliver-request"]

permissions:
  contents: write
  actions: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Read request
        id: req
        run: cat .github/deliver-request >> "$GITHUB_OUTPUT"

      # The request may name a specific artifact (e.g. one shard); the
      # default is the collected full-week artifact.
      - uses: actions/download-artifact@v8
        with:
          name: ${{ steps.req.outputs.artifact || format('renders-week-{0}', steps.req.outputs.week) }}
          run-id: ${{ steps.req.outputs.run_id }}
          github-token: ${{ github.token }}
          path: renders/week-${{ steps.req.outputs.week }}

      - name: Push renders branch
        run: |
          week="${{ steps.req.outputs.week }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan "renders-week-$week"
          git add -f "renders/week-$week"
          git commit -m "Renders for week $week (run ${{ steps.req.outputs.run_id }})"
          git push -f origin "renders-week-$week"
