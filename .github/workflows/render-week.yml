name: Render week

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to render (e.g. 01)"
        required: true
        default: "01"
  push:
    branches: [main]
    paths: [".github/render-request"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4

      - name: Resolve week number
        id: week
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            echo "week=${{ inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            echo "week=$(tr -cd '0-9' < .github/render-request)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check required secrets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          missing=0
          for v in ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID PEXELS_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore TTS/b-roll cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm install --no-audit --no-fund

      - name: Install Chromium for overlay rendering
        run: npx playwright@1.49.0 install --with-deps chromium

      - name: Render week
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node pipeline/produce.mjs "${{ steps.week.outputs.week }}"

      - name: Show posting sheet
        run: cat "renders/week-${{ steps.week.outputs.week }}/posting-sheet.md"

      - uses: actions/upload-artifact@v4
        with:
          name: renders-week-${{ steps.week.outputs.week }}
          path: renders/week-${{ steps.week.outputs.week }}/
          if-no-files-found: error
          retention-days: 14

      - name: Push renders branch
        run: |
          week="${{ steps.week.outputs.week }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan "renders-week-$week"
          git add -f "renders/week-$week"
          git commit -m "Renders for week $week (run ${{ github.run_id }})"
          git push -f origin "renders-week-$week"
