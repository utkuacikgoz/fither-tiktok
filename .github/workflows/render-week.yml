name: Render week

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to render (e.g. 01)"
        required: true
        default: "01"
  push:
    branches: [main]
    paths: [".github/render-request"]

permissions:
  contents: write
  actions: read

# A newer render supersedes a running one; never let two runs race the
# renders branch.
concurrency:
  group: render-week
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      week: ${{ steps.week.outputs.week }}
      slugs: ${{ steps.slugs.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The preflight imports pipeline libraries (undici via lib/env.mjs),
      # so the plan job needs the pipeline dependencies installed too.
      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Preflight content, experiments and assets
        run: |
          node pipeline/validate.mjs
          node pipeline/assets.mjs --check

      - name: Resolve week number
        id: week
        run: |
          if [ -n "${{ inputs.week }}" ]; then
            week="${{ inputs.week }}"
          else
            # First number in the file is the week; trailing words/counters
            # in the request line must not bleed into it.
            week=$(grep -oE '[0-9]+' .github/render-request | head -n1)
          fi
          week=$(printf '%02d' "$((10#$week))")
          echo "week=$week" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          missing=0
          for v in ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID PEXELS_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: List the week's videos
        id: slugs
        run: |
          week="${{ steps.week.outputs.week }}"
          slugs=$(node -e '
            const { readdirSync, readFileSync } = require("fs");
            const week = process.argv[1];
            const slugs = readdirSync("content/scripts")
              .filter((f) => f.endsWith(".json"))
              .map((f) => JSON.parse(readFileSync("content/scripts/" + f, "utf8")))
              .filter((s) => String(s.week).padStart(2, "0") === week)
              .map((s) => s.slug)
              .sort();
            if (slugs.length === 0) { console.error("no sidecars for week " + week); process.exit(1); }
            console.log(JSON.stringify(slugs));
          ' "$week")
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.plan.outputs.slugs) }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore TTS/b-roll cache
        uses: actions/cache@v6
        with:
          path: pipeline/cache
          key: pipeline-cache-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: |
            pipeline-cache-${{ matrix.slug }}-
            pipeline-cache-

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for overlay rendering
        run: npx playwright@1.62.1 install --with-deps chromium

      - name: Render video
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node pipeline/render.mjs "content/scripts/${{ matrix.slug }}.md"

      - uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.slug }}
          path: renders/week-${{ needs.plan.outputs.week }}/
          if-no-files-found: error
          retention-days: 3

  collect:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gather shards
        uses: actions/download-artifact@v8
        with:
          pattern: shard-*
          path: renders/week-${{ needs.plan.outputs.week }}/
          merge-multiple: true

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm ci --no-audit --no-fund

      - name: Block repeated footage
        run: node pipeline/shots.mjs "${{ needs.plan.outputs.week }}"

      - name: Build posting sheet
        run: node pipeline/sheet.mjs "${{ needs.plan.outputs.week }}"

      - name: Show posting sheet
        run: cat "renders/week-${{ needs.plan.outputs.week }}/posting-sheet.md"

      - uses: actions/upload-artifact@v7
        with:
          name: renders-week-${{ needs.plan.outputs.week }}
          path: renders/week-${{ needs.plan.outputs.week }}/
          if-no-files-found: error
          retention-days: 14

      - name: Push renders branch
        run: |
          week="${{ needs.plan.outputs.week }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch --orphan "renders-week-$week"
          git add -f "renders/week-$week"
          git commit -m "Renders for week $week (run ${{ github.run_id }})"
          git push -f origin "renders-week-$week"
