name: Render week

on:
  workflow_dispatch:
    inputs:
      week:
        description: "Week number to render (e.g. 01)"
        required: true
        default: "01"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          missing=0
          for v in ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID PEXELS_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pipeline dependencies
        working-directory: pipeline
        run: npm install --no-audit --no-fund

      - name: Install Chromium for overlay rendering
        run: npx playwright@1.49.0 install --with-deps chromium

      - name: Render week ${{ inputs.week }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node pipeline/produce.mjs "${{ inputs.week }}"

      - name: Show posting sheet
        run: cat "renders/week-${{ inputs.week }}/posting-sheet.md"

      - uses: actions/upload-artifact@v4
        with:
          name: renders-week-${{ inputs.week }}
          path: renders/week-${{ inputs.week }}/
          if-no-files-found: error
          retention-days: 14
