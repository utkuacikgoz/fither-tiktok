<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("__FONT_400__") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_600__") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; background: transparent; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    padding: 0 72px 340px;
  }
  body.center { justify-content: center; padding-bottom: 0; }
  .panel {
    background: rgba(250, 247, 242, 0.94); /* warm bone */
    border-radius: 32px;
    padding: 44px 52px;
    max-width: 936px;
    box-shadow: 0 12px 48px rgba(31, 29, 26, 0.18);
  }
  .accent-bar {
    width: 72px; height: 8px; border-radius: 4px;
    background: #5C6F5E; /* deep sage */
    margin-bottom: 28px;
  }
  .text {
    color: #1F1D1A;
    font-weight: 600;
    font-size: 58px;
    line-height: 1.22;
    letter-spacing: -0.01em;
  }
  body.hook .text { font-size: 76px; line-height: 1.15; }
  body.step .text { font-size: 58px; }
  body.cta .panel { background: #5C6F5E; }
  body.cta .text { color: #FAF7F2; }
  body.cta .accent-bar { background: #B98A2F; } /* gold, the ask moment */
</style>
</head>
<body class="__STYLE__">
  <div class="panel">
    <div class="accent-bar"></div>
    <div class="text">__TEXT__</div>
  </div>
</body>
</html>
