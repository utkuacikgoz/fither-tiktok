<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "InterBlack";
    src: url("__FONT_900__") format("woff2");
    font-weight: 900;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_400__") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_600__") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --bone: #FAF7F2;
    --ink: #151412;
    --soft: rgba(250, 247, 242, 0.62);
    --gold: #E2B455;
    position: relative;
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(circle at 110% -6%, rgba(226, 180, 85, 0.22) 0 420px, transparent 422px),
      linear-gradient(172deg, #1E1C19 0%, #151412 60%, #0F0E0D 100%);
    color: var(--bone);
  }
  /* The last slide flips to gold so the question lands on a different ground. */
  body.cta {
    --bone: #151412;
    --soft: rgba(21, 20, 18, 0.66);
    --gold: #151412;
    background:
      radial-gradient(circle at -10% 108%, rgba(250, 247, 242, 0.28) 0 380px, transparent 382px),
      linear-gradient(172deg, #EFC26A 0%, #E2B455 100%);
    color: var(--bone);
  }
  /* Film grain over everything, so flat colour reads as print, not a slide deck. */
  body::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
    background-size: 300px 300px;
    mix-blend-mode: soft-light;
    opacity: 0.9;
  }
  /* Poster: one saturated colour per slide, rotating, so a swipe changes the wall. */
  body.bg-poster { background: var(--poster); }
  body.bg-poster.p0 { --poster: #E2B455; --bone: #151412; --soft: rgba(21,20,18,0.66); --gold: #151412; color: var(--bone); }
  /* Brand palette only: gold, sage, ink, deep sage, bone. Nothing new. */
  body.bg-poster.p1 { --poster: #5C6F5E; }
  body.bg-poster.p2 { --poster: #151412; }
  body.bg-poster.p3 { --poster: #2F4A3A; }
  body.bg-poster.p4 { --poster: #FAF7F2; --bone: #151412; --soft: rgba(21,20,18,0.66); --gold: #5C6F5E; color: var(--bone); }
  body.bg-poster.p0 .kicker { background: #151412; color: #E2B455; }
  body.bg-poster.p0 .ghost { color: rgba(21,20,18,0.08); }
  body.bg-poster.p4 .kicker { background: #5C6F5E; color: #FAF7F2; }
  body.bg-poster.p4 .ghost { color: rgba(21,20,18,0.06); }
  body.bg-poster.cta { --poster: #E2B455; --bone: #151412; --soft: rgba(21,20,18,0.66); --gold: #151412; background: var(--poster); }
  body.bg-poster.cta .kicker { background: #151412; color: #E2B455; }
  body.bg-poster.cta .ghost { color: rgba(21,20,18,0.07); }
  /* Cream: the bold type on the editorial ground, so a bold cover and a
     cream body read as one deck. */
  body.bg-cream {
    --bone: #1F1D1A; --soft: #6E675E; --gold: #B98A2F;
    background:
      radial-gradient(circle at 102% 8%, rgba(143, 164, 145, 0.24) 0 220px, transparent 222px),
      radial-gradient(circle at -8% 96%, rgba(185, 138, 47, 0.10) 0 280px, transparent 282px),
      linear-gradient(168deg, #FAF7F2 0%, #EDF0EB 100%);
    color: var(--bone);
  }
  body.bg-cream .kicker { background: #1F1D1A; color: #E2B455; }
  body.bg-cream .ghost { color: rgba(31, 29, 26, 0.05); }
  body.bg-cream .count { color: #5C6F5E; }
  body.bg-cream .cue { color: #5C6F5E; }
  body.bg-cream .progress span { background: rgba(110, 103, 94, 0.20); }
  body.bg-cream .progress span:nth-child(-n+__INDEX__) { background: #B98A2F; }
  body.bg-cream::after { opacity: 0.5; }
  /* Halftone: a huge dot screen behind the type. */
  body.bg-halftone {
    background:
      radial-gradient(circle at 78% 62%, rgba(226,180,85,0.55) 0 8px, transparent 9px) 0 0 / 34px 34px,
      radial-gradient(circle at 78% 62%, rgba(226,180,85,0.18) 0 460px, transparent 462px),
      linear-gradient(172deg, #1E1C19 0%, #151412 60%, #0F0E0D 100%);
    background-blend-mode: normal, normal, normal;
  }
  body.bg-halftone:not(.cta) {
    background:
      radial-gradient(circle at 76% 64%, rgba(226,180,85,0.28) 0 520px, transparent 522px),
      repeating-radial-gradient(circle at 76% 64%, rgba(250,247,242,0.10) 0 2px, transparent 2px 26px),
      linear-gradient(172deg, #1E1C19 0%, #151412 60%, #0F0E0D 100%);
  }
  /* Mesh: loud multi-colour gradient, the most feed-native of the three. */
  body.bg-mesh:not(.cta) {
    background:
      radial-gradient(circle at 8% 88%, #E2B455 0 200px, transparent 560px),
      radial-gradient(circle at 96% 58%, #5C6F5E 0 240px, transparent 600px),
      radial-gradient(circle at 60% 6%, #2F4A3A 0 200px, transparent 560px),
      linear-gradient(160deg, #1E1C19 0%, #0F0E0D 100%);
  }
  body.bg-mesh.cta {
    --bone: #151412; --soft: rgba(21,20,18,0.66); --gold: #151412;
    background:
      radial-gradient(circle at 18% 22%, #FAF7F2 0 260px, transparent 620px),
      radial-gradient(circle at 88% 84%, #5C6F5E 0 220px, transparent 600px),
      #E2B455;
  }
  body.bg-mesh.cta .kicker { background: #151412; color: #E2B455; }
  /* Giant faint numeral: the slide number as the background texture. */
  .ghost {
    position: absolute;
    right: -30px;
    bottom: 120px;
    font-family: "InterBlack", "Inter", sans-serif;
    font-weight: 900;
    font-size: 900px;
    line-height: 0.8;
    letter-spacing: -0.06em;
    color: rgba(250, 247, 242, 0.05);
    user-select: none;
  }
  body.cta .ghost { color: rgba(21, 20, 18, 0.07); }
  body.solo .ghost { display: none; }
  .top {
    position: absolute;
    top: 104px;
    left: 96px;
    right: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mark {
    font-family: "InterBlack", "Inter", sans-serif;
    font-weight: 900;
    font-size: 34px;
    letter-spacing: 0.26em;
    color: var(--bone);
  }
  .count {
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.12em;
    color: var(--gold);
  }
  .progress {
    position: absolute;
    top: 184px;
    left: 96px;
    right: 96px;
    height: 10px;
    display: grid;
    grid-template-columns: repeat(__TOTAL__, 1fr);
    gap: 12px;
  }
  .progress span { background: rgba(250, 247, 242, 0.14); border-radius: 5px; }
  body.cta .progress span { background: rgba(21, 20, 18, 0.16); }
  .progress span:nth-child(-n+__INDEX__) { background: var(--gold); }
  body.solo .count, body.solo .progress { display: none; }
  .content {
    position: absolute;
    top: 44%;
    left: 96px;
    right: 96px;
    transform: translateY(-50%);
  }
  .kicker {
    display: inline-block;
    min-height: 44px;
    padding: 12px 22px;
    background: var(--gold);
    color: var(--ink);
    font-family: "InterBlack", "Inter", sans-serif;
    font-weight: 900;
    font-size: 30px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 44px;
  }
  body.cta .kicker { background: var(--ink); color: #E2B455; }
  .kicker:empty { display: none; }
  .text {
    max-width: 900px;
    font-family: "InterBlack", "Inter", sans-serif;
    font-weight: 900;
    font-size: 108px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--bone);
    text-wrap: balance;
  }
  .text.short { font-size: 138px; line-height: 0.94; }
  .text.long { font-size: 84px; line-height: 1.02; }
  .footer {
    position: absolute;
    bottom: 262px;
    left: 96px;
    right: 330px;
    min-height: 44px;
    color: var(--soft);
    font-size: 31px;
    line-height: 1.35;
  }
  .cue {
    position: absolute;
    bottom: 262px;
    right: 96px;
    font-family: "InterBlack", "Inter", sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 0.12em;
    color: var(--gold);
  }
</style>
</head>
<body class="__KIND__ __SOLO__ __BACKGROUND__">
  <div class="ghost">__INDEX__</div>
  <header class="top">
    <div class="mark">FITHER</div>
    <div class="count">__INDEX__ / __TOTAL__</div>
  </header>
  <div class="progress">__PROGRESS__</div>
  <main class="content">
    <div class="kicker">__KICKER__</div>
    <div class="text __TEXT_CLASS__">__TEXT__</div>
  </main>
  <div class="footer">__FOOTER__</div>
  <div class="cue">__CUE__</div>
</body>
</html>
