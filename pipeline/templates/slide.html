<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Inter";
    src: url("__FONT_400__") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_600__") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: linear-gradient(168deg, #FAF7F2 0%, #E7ECE7 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .kicker {
    color: #5C6F5E;
    font-weight: 600;
    font-size: 34px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 44px;
  }
  .text {
    color: #1F1D1A;
    font-weight: 600;
    font-size: 88px;
    line-height: 1.16;
    letter-spacing: -0.015em;
  }
  .footer {
    position: absolute;
    bottom: 120px; left: 96px;
    color: #6E675E;
    font-weight: 400;
    font-size: 30px;
  }
</style>
</head>
<body>
  <div class="kicker">__KICKER__</div>
  <div class="text">__TEXT__</div>
  <div class="footer">__FOOTER__</div>
</body>
</html>
