<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("__FONT_DISPLAY__") format("woff2");
    font-weight: 600;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_400__") format("woff2");
    font-weight: 400;
  }
  @font-face {
    font-family: "Inter";
    src: url("__FONT_600__") format("woff2");
    font-weight: 600;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --ink: #1F1D1A;
    --soft: #6E675E;
    --accent: #5C6F5E;
    --gold: #B98A2F;
    position: relative;
    font-family: "Inter", system-ui, sans-serif;
    background:
      radial-gradient(circle at 102% 8%, rgba(143, 164, 145, 0.24) 0 220px, transparent 222px),
      radial-gradient(circle at -8% 96%, rgba(185, 138, 47, 0.10) 0 280px, transparent 282px),
      linear-gradient(168deg, #FAF7F2 0%, #EDF0EB 100%);
    color: var(--ink);
  }
  body.cta {
    --ink: #FAF7F2;
    --soft: rgba(250, 247, 242, 0.72);
    --accent: #FAF7F2;
    --gold: #D4AA57;
    background:
      radial-gradient(circle at 104% 4%, rgba(250, 247, 242, 0.08) 0 260px, transparent 262px),
      radial-gradient(circle at -12% 94%, rgba(212, 170, 87, 0.16) 0 330px, transparent 332px),
      #5C6F5E;
  }
  .top {
    position: absolute;
    top: 104px;
    left: 96px;
    right: 152px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .mark {
    color: var(--accent);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.22em;
  }
  .count {
    color: var(--soft);
    font-size: 27px;
    letter-spacing: 0.08em;
  }
  .progress {
    position: absolute;
    top: 178px;
    left: 96px;
    right: 152px;
    height: 4px;
    display: grid;
    grid-template-columns: repeat(__TOTAL__, 1fr);
    gap: 10px;
  }
  .progress span { background: rgba(110, 103, 94, 0.20); border-radius: 2px; }
  body.solo .count, body.solo .progress { display: none; }
  body.cta .progress span { background: rgba(250, 247, 242, 0.22); }
  .progress span:nth-child(-n+__INDEX__) { background: var(--gold); }
  /* Centred with flex, not a transform: a transformed ancestor would trap
     the fixed-position footer below, so the box runs from the top to 18%
     above the bottom and centres its children (centre line at 41%). */
  .content {
    position: absolute;
    top: 0;
    bottom: 18%;
    left: 96px;
    right: 152px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .rule {
    width: 84px;
    height: 6px;
    border-radius: 3px;
    background: var(--gold);
    margin-bottom: 40px;
  }
  .kicker {
    min-height: 41px;
    color: var(--accent);
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .kicker:empty { display: none; }
  .text {
    max-width: 820px;
    color: var(--ink);
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 88px;
    line-height: 1.10;
    letter-spacing: -0.018em;
    text-wrap: balance;
  }
  .text.short { font-size: 104px; line-height: 1.06; }
  .text.long { font-size: 72px; line-height: 1.14; }
  .footer {
    /* Fixed, not absolute: the footer lives inside .content in the DOM so a
       figure slide can flow it under the text, but on a plain slide it must
       anchor to the canvas bottom, not to the .content box. */
    position: fixed;
    width: 674px;
    bottom: 270px;
    left: 96px;
    right: 310px;
    min-height: 42px;
    color: var(--soft);
    font-size: 29px;
    line-height: 1.35;
  }
  .cue {
    position: absolute;
    bottom: 270px;
    right: 152px;
    color: var(--accent);
    font-weight: 600;
    font-size: 27px;
    letter-spacing: 0.08em;
  }
  /* Figure slide: the authored movement export's peak frame is the ground.
     The export leaves its upper half empty by design, so the text sits
     there and the figure holds the lower half. Scaled from the top so the
     export's progress ring falls below the canvas. */
  body.figure::before {
    content: "";
    position: absolute; inset: 0;
    background: url("__FIGURE__") center bottom / 1080px auto no-repeat;
    -webkit-mask-image: linear-gradient(to bottom, transparent 240px, #000 640px);
    mask-image: linear-gradient(to bottom, transparent 240px, #000 640px);
  }
  body.figure .content { top: 19%; bottom: auto; display: block; }
  body.figure .text { max-width: 740px; font-size: 72px; }
  body.figure .text.short { font-size: 84px; }
  body.figure .text.long { font-size: 60px; }
  body.figure .footer { position: static; margin-top: 34px; right: auto; }
  body.figure .cue { left: 96px; right: auto; bottom: 96px; }
  body.figure .top, body.figure .progress, body.figure .content, body.figure .cue { position: absolute; z-index: 1; }
</style>
</head>
<body class="__KIND__ __SOLO__ __FIGURE_CLASS__">
  <header class="top">
    <div class="mark">FITHER</div>
    <div class="count">__INDEX__ / __TOTAL__</div>
  </header>
  <div class="progress">__PROGRESS__</div>
  <main class="content">
    <div class="rule"></div>
    <div class="kicker">__KICKER__</div>
    <div class="text __TEXT_CLASS__">__TEXT__</div>
    <div class="footer">__FOOTER__</div>
  </main>
  <div class="cue">__CUE__</div>
</body>
</html>
